schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Satisfactory mod (Satisfactory Mod Loader / SML) built with Unreal Engine 5.6.1 (C++ and Blueprint), Windows only.
  Engine install: D:/Projects/UE_5.6. Game install: D:/Games/SatisfactoryEarlyAccess.
  Goal: a modular truck station. The vanilla truck station keeps its inventory and docking logic; snap-on modules add extra
  belt input/output ports that feed or drain the station's cargo inventory (similar to freight platforms on a train station).
  Vanilla station has 1 fuel input, 2 cargo inputs and 2 cargo outputs.
  Do not modify or replace vanilla game classes or assets; extend them. Existing saves must keep loading.
  Designs must address multiplayer replication and save/load of module links.
  Binary assets (uasset/umap/textures/meshes) are stored in Git LFS.

